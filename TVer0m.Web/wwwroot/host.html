<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TVer0m</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/host.css">
</head>
<body>
    <header><div id="date"></div><div id="clock"></div></header>
    <main id="tiles"></main>
    <script>
        var tilesElement = document.getElementById("tiles");

        function updateClock() {
            var now = new Date();
            document.getElementById("clock").textContent = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
            document.getElementById("date").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
        }

        function showMessage(text) {
            var message = document.createElement("div");
            message.id = "message";
            message.textContent = text;
            tilesElement.appendChild(message);
        }

        function addTile(service) {
            var tile = document.createElement("button");
            tile.className = "tile";
            tile.textContent = service.name;
            tile.style.background = service.colour;
            tile.addEventListener("click", function () { window.location.href = service.url; });
            tilesElement.appendChild(tile);
        }

        // Moves focus to the nearest tile in the pressed direction.
        function move(direction) {
            var tiles = Array.from(document.querySelectorAll(".tile"));
            var current = document.activeElement;
            if (!current || !current.classList.contains("tile")) {
                if (tiles.length > 0) { tiles[0].focus(); }
                return;
            }
            var from = current.getBoundingClientRect();
            var fromX = from.left + from.width / 2;
            var fromY = from.top + from.height / 2;
            var best = null;
            var bestScore = Infinity;
            tiles.forEach(function (tile) {
                if (tile === current) { return; }
                var box = tile.getBoundingClientRect();
                var dx = box.left + box.width / 2 - fromX;
                var dy = box.top + box.height / 2 - fromY;
                var ahead = direction === "left" ? -dx : direction === "right" ? dx : direction === "up" ? -dy : dy;
                if (ahead <= 0) { return; }
                var across = direction === "left" || direction === "right" ? Math.abs(dy) : Math.abs(dx);
                var score = ahead + across * 2;
                if (score < bestScore) { bestScore = score; best = tile; }
            });
            if (best) { best.focus(); }
        }

        var directions = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
        document.addEventListener("keydown", function (event) {
            var direction = directions[event.key];
            if (direction) {
                event.preventDefault();
                move(direction);
            }
        });

        fetch("services.json", { cache: "no-store" })
            .then(function (response) { return response.json(); })
            .then(function (services) {
                services.forEach(addTile);
                var first = document.querySelector(".tile");
                if (first) { first.focus(); } else { showMessage("No services configured"); }
            })
            .catch(function () { showMessage("Could not load services.json"); });

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
